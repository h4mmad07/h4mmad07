<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
<title id="title">Hammad — 3D Developer Profile</title>
<desc id="desc">A futuristic isometric developer workstation with a floating monitor, code panels, glowing 3D cube and geometric platform.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset=".55" stop-color="#0b1d31"/><stop offset="1" stop-color="#102d45"/></linearGradient>
  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8af2ff"/><stop offset="1" stop-color="#138bbd"/></linearGradient>
  <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9b8cff"/><stop offset="1" stop-color="#4c42a6"/></linearGradient>
  <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#142e46"/><stop offset="1" stop-color="#07101e"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feGaussianBlur in="SourceAlpha" stdDeviation="9"/><feOffset dy="12"/><feComponentTransfer><feFuncA type="linear" slope=".45"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#4ebde0" stroke-opacity=".12" stroke-width="1"/></pattern>
</defs>
<rect width="1200" height="430" rx="24" fill="url(#bg)"/>
<rect width="1200" height="430" rx="24" fill="url(#grid)"/>
<circle cx="930" cy="150" r="150" fill="#1689b4" opacity=".10" filter="url(#glow)"/>
<circle cx="1010" cy="300" r="100" fill="#7b6cff" opacity=".10" filter="url(#glow)"/>
<!-- isometric base -->
